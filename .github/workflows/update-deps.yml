name: Update dependencies

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}

permissions: {}

jobs:
  update:
    name: npm update
    permissions:
      contents: write # push the autoupdate branch
      pull-requests: write # open the update pull request
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mise # zizmor: ignore[self-repository] -- actionlint 1.7.12 rejects the $/ form
      - name: Upgrade the mise tools
        run: |
          mise lock --bump --minimum-release-age 3d --platform macos-arm64,linux-x64,windows-x64
          mise install --locked
        env:
          GITHUB_TOKEN: ${{ github.token }}
      # mise lock exits 0 even when a platform has no asset.
      - name: Check mise.lock pins every tool
        run: task check ONLY=mise-lock
      - name: Upgrade dependencies within declared ranges
        run: npm update --save
      - name: Auto-fix formatting and lint
        run: task fix || true
      - uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with: # zizmor: ignore[superfluous-actions] -- create-pull-request also commits, pushes and updates the open pull request on later runs
          commit-message: "chore: update dependencies and dev tools"
          branch: autoupdate-tools
          title: "chore: update dependencies and dev tools"
          body: Automated in-range update of npm dependencies and mise tools.
          delete-branch: true
