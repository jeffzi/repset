name: CI

on:
  push:
    branches: [main, fix-ci/**]
    paths-ignore:
      - "**.md"
      - LICENSE
      - .fallowrc.json
      - .gitignore
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  ci:
    name: Build, test and check
    permissions:
      contents: read
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The secret scan reads every commit of the pull request.
          fetch-depth: 0

      - uses: ./.github/actions/setup-mise # zizmor: ignore[self-repository] -- actionlint 1.7.12 rejects the $/ form
        with:
          install_args: >-
            --locked node bun aqua:go-task/task ${{ runner.os == 'Linux' && 'aqua:rhysd/actionlint
            aqua:zizmorcore/zizmor aqua:gitleaks/gitleaks aqua:lycheeverse/lychee' || '' }}

      - name: Test
        run: task test

      # The diff first: a rewritten file also fails check's coverage step with misleading advice.
      - name: Check
        if: runner.os == 'Linux'
        run: |
          status=0
          task check || status=$?
          git diff --exit-code
          exit "$status"
