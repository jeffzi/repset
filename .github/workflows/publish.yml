name: Publish

on:
  release:
    types: [published]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  # The same matrix pull requests run — no hand-copied subset that drifts.
  ci:
    uses: ./.github/workflows/ci.yml # zizmor: ignore[self-repository] -- actionlint 1.7.12 rejects the $/ form
    permissions:
      contents: read

  build:
    name: Build and verify package
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-mise # zizmor: ignore[self-repository] -- actionlint 1.7.12 rejects the $/ form
        with:
          install_args: --locked node aqua:go-task/task
      - name: Verify tag matches package version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
      - name: Check published surface
        run: task check-package
      - name: Pack
        run: |
          task build
          npm pack
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: "*.tgz"

  # OIDC trusted publishing: id-token:write is scoped to this job only, and the
  # pre-built tarball is published so no project build scripts run while the
  # token is available. Configure the npm trusted publisher for this repo +
  # workflow on npmjs.com first; publishing stays inert while package.json has
  # "private": true.
  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      id-token: write # OIDC token for npm trusted publishing; no repository access
    steps:
      - name: Setup Node.js
        # zizmor: ignore[cache-poisoning] -- setup-node does not cache unless cache: is set
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"
      - name: Update npm (trusted publishing needs >= 11.5.1; lts/* may ship older)
        # zizmor: ignore[adhoc-packages] -- upgrading the npm CLI itself, not a project dependency
        run: npm install -g npm@latest
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
      # Publishes over OIDC and attaches provenance attestations by default.
      # --access public matters only for scoped packages; unscoped ignores it.
      - name: Publish to npm
        run: npm publish ./*.tgz --access public
