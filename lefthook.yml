# yaml-language-server: $schema=https://json.schemastore.org/lefthook.json
glob_matcher: doublestar
lefthook: mise exec -- lefthook

pre-commit:
  commands:
    lint:
      priority: 1
      run: mise exec -- task check ONLY=lint -- {staged_files}
      stage_fixed: true
    md:
      priority: 1
      run: mise exec -- task check ONLY=md -- {staged_files}
      stage_fixed: true
    fmt:
      priority: 2
      run: mise exec -- task check ONLY=fmt -- {staged_files}
      stage_fixed: true
    links:
      priority: 2
      run: mise exec -- task check ONLY=links -- {staged_files}
    types:
      priority: 3
      glob: "**/*.{ts,tsx,mts,cts}"
      run: mise exec -- task check ONLY=types
    spelling:
      priority: 3
      run: mise exec -- task check ONLY=spelling -- {staged_files}
    actions:
      priority: 3
      run: mise exec -- task check ONLY=actions -- {staged_files}
    secrets:
      priority: 4
      run: mise exec -- task check ONLY=secrets

commit-msg:
  commands:
    commitlint:
      run: mise exec -- task check ONLY=commitlint -- {1}

pre-push:
  piped: true
  commands:
    test:
      priority: 1
      run: mise exec -- task test
    # check fixes files and exits 0, so a rewrite would only fail in CI.
    check:
      priority: 2
      run: |
        before=$(git diff)
        status=0
        mise exec -- task check || status=$?
        if [ "$before" != "$(git diff)" ]; then
          echo "task check rewrote files: commit the fixes, then push again" >&2
          exit 1
        fi
        exit "$status"
