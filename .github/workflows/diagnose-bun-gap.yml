name: Bun gap diagnosis

# Measurement only, never merged: times repset, the timing accuracy check's baseline loop and the
# baseline variants on Bun, one process at a time, to find why repset reads above the baseline on
# one-call scenarios. `runs-on` cannot choose the machine, so one run starts six jobs at once, each on
# its own runner, and the CPU models they land on are recorded with no rerun; the "Machine" step
# names the CPU, and the job log's "Set up job" header the cloud.
on:
  push:
    branches: [fix-ci/bun-timing-gap]
    paths:
      - .github/workflows/diagnose-bun-gap.yml
      - scripts/diagnose-bun-gap.ts
      - scripts/diagnose-bun-gap/**
      - Taskfile.yml
  workflow_dispatch:

# One group per run attempt: each run lands on its own machine, and a group shared across runs or
# attempts would let a queued rerun replace another.
concurrency:
  group: diagnose-bun-gap-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

permissions: {}

# The sides to time: repset, the pre-fix baseline, the baseline run inside repset's child and its
# A/A copy, `none`, and repset's child started directly.
env:
  SIDES: repset,baseline,child-baseline,child-baseline-again,none,repset-child-direct

jobs:
  diagnose:
    name: Bun gap diagnosis, job ${{ matrix.job }}, unpinned then pinned
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 330
    # Six runners at once; every job is recorded, so one failing stops none of the others.
    strategy:
      fail-fast: false
      matrix:
        job: [0, 1, 2, 3, 4, 5]
    env:
      JOB: ${{ matrix.job }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-mise # zizmor: ignore[self-repository] -- actionlint 1.7.12 rejects the $/ form
        with:
          install_args: --locked node bun aqua:go-task/task

      - name: Machine
        run: |
          lscpu
          printf 'nproc: %s\n' "$(nproc)"
          printf 'sys_vendor: %s\n' "$(cat /sys/class/dmi/id/sys_vendor 2>/dev/null || printf unreadable)"
          printf 'product_name: %s\n' "$(cat /sys/class/dmi/id/product_name 2>/dev/null || printf unreadable)"

      # The fixed check itself, beside the CPU model the "Machine" step printed. Its output and exit
      # status go to out/; a failing check is a reading, so the step never fails the job.
      - name: Timing accuracy check
        # `shell: bash` adds pipefail, so the status below is the check's and not tee's.
        shell: bash
        run: |
          mkdir -p out
          status=0
          task check-timing-accuracy 2>&1 | tee out/check-timing-accuracy.txt || status=$?
          printf '%s\n' "$status" >out/check-timing-accuracy.status
          printf 'check-timing-accuracy exited %s\n' "$status"

      - name: Unpinned pass
        id: unpinned
        run: |
          mkdir -p out
          task diagnose-bun-gap -- --job "$JOB" --sides "$SIDES" --out out/unpinned.jsonl

      # Runs after a failed unpinned pass too; a skipped one means setup failed.
      - name: Pinned pass
        if: ${{ !cancelled() && steps.unpinned.outcome != 'skipped' }}
        run: task diagnose-bun-gap -- --pin --job "$JOB" --sides "$SIDES" --out out/pinned.jsonl

      # Always, so a failed pass or a job stopped at its timeout keeps every finished reading.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: readings-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.job }}
          path: out/
          if-no-files-found: warn
