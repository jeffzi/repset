name: Links

# Web URLs in Markdown. Scheduled only: a slow site or an untagged release link would block merges.
on:
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:

concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  links:
    name: Web links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-mise # zizmor: ignore[self-repository] -- actionlint 1.7.12 rejects the $/ form
        with:
          install_args: --locked node aqua:go-task/task aqua:lycheeverse/lychee

      - name: Check web links
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids GitHub's anonymous rate limit
        run: task check ONLY=urls
