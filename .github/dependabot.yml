version: 2
updates:
  - package-ecosystem: github-actions
    directories: [/, /.github/actions/*]
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 3 # zizmor: ignore[dependabot-cooldown] -- 3 days everywhere, as .npmrc and mise
    commit-message:
      prefix: "build(deps)"
