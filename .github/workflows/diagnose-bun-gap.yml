name: Bun gap diagnosis

# Measurement only, never merged: times repset, the timing accuracy check's baseline loop and the
# baseline variants on Bun, one process at a time, to find why repset reads above the baseline on
# one-call scenarios. `runs-on` cannot choose the machine, so the job is rerun until the CPU models
# the diagnosis needs have run it; the "Machine" step names the CPU, and the job log's "Set up job"
# header the cloud.
on:
  push:
    branches: [fix-ci/bun-timing-gap]
    paths:
      - .github/workflows/diagnose-bun-gap.yml
      - scripts/diagnose-bun-gap.ts
      - scripts/diagnose-bun-gap/**
      - Taskfile.yml
  workflow_dispatch:

# One group per run attempt: each run lands on its own machine, and a group shared across runs or
# attempts would let a queued rerun replace another.
concurrency:
  group: diagnose-bun-gap-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

permissions: {}

# The sides to time: the baseline, its A/A copy, `none`, one side per piece of the code around
# `none`'s loop, and three sides that split repset's process.
env:
  SIDES: repset,baseline,baseline-again,none,baseline-args,baseline-async,baseline-table,baseline-proc,baseline-with-variants,baseline-child-modules,baseline-under-parent,repset-child-direct

jobs:
  diagnose:
    name: Bun gap diagnosis, unpinned then pinned
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-mise # zizmor: ignore[self-repository] -- actionlint 1.7.12 rejects the $/ form
        with:
          install_args: --locked node bun aqua:go-task/task

      - name: Machine
        run: |
          lscpu
          printf 'nproc: %s\n' "$(nproc)"
          printf 'sys_vendor: %s\n' "$(cat /sys/class/dmi/id/sys_vendor 2>/dev/null || printf unreadable)"
          printf 'product_name: %s\n' "$(cat /sys/class/dmi/id/product_name 2>/dev/null || printf unreadable)"

      - name: Unpinned pass
        id: unpinned
        run: |
          mkdir -p out
          task diagnose-bun-gap -- --sides "$SIDES" --out out/unpinned.jsonl

      # Runs after a failed unpinned pass too; a skipped one means setup failed.
      - name: Pinned pass
        if: ${{ !cancelled() && steps.unpinned.outcome != 'skipped' }}
        run: task diagnose-bun-gap -- --pin --sides "$SIDES" --out out/pinned.jsonl

      # Always, so a failed pass or a job stopped at its timeout keeps every finished reading.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: readings-${{ github.run_id }}-${{ github.run_attempt }}
          path: out/
          if-no-files-found: warn
